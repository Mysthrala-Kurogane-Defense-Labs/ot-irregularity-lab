name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12 and dependencies
        run: uv sync --python 3.12 --extra dev --group lint
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
