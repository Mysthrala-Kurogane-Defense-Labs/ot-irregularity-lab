name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        extra: [core, opcua, modbus]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.extra }}
      - name: Install Python 3.12 and dependencies
        run: uv sync --python 3.12 --extra dev --extra calibration ${{ matrix.extra != 'core' && format('--extra {0}', matrix.extra) || '' }} --group lint
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
