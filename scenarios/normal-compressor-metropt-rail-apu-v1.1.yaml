scenario_id: normal-compressor-metropt-rail-apu-v1.1
scenario_version: 1.0.0
run_id: compressor-apu-0042
description: >-
  Synthetic rail-APU-inspired compressor profile. The IDLE-to-offloaded mapping is
  an explicit interpretation of public MetroPT-3 variable documentation.
duration_s: 600
sampling_interval_ms: 1000
ambient_temperature_c: 22
expose_operating_regime: true
assets:
  - asset_id: COMPRESSOR-01
    asset_class: compressor
    process_profile: metropt3_rail_apu
    process_profile_version: 1.1.0
    process_parameters:
      current_start_a: 9.0
      current_unloaded_a: 4.0
      oil_thermal_tau_s: 900
    regimes: ["OFF", IDLE, WARMUP, LOW_LOAD, NORMAL_LOAD, HIGH_LOAD, COOLDOWN, MAINTENANCE]
shift_pattern: ["OFF", IDLE, LOW_LOAD, NORMAL_LOAD, HIGH_LOAD, IDLE]
